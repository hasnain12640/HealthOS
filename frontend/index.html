<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthOS</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('healthos-settings') || '{}');
        if (s.state) {
          if (s.state.theme === 'light') document.documentElement.classList.add('light');
          if (s.state.language === 'ur') { document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'ur'); }
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
